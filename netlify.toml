[build]
  publish = "."
  # Changes only inside closingdate/ belong to the closingdate.lk site: do not redeploy Sabha Brief for them.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)closingdate'"

# Government jobs moved to closingdate.lk. Forced, so the old addresses redirect even if a file reappears.
[[redirects]]
  from = "/jobs.html"
  to = "https://closingdate.lk/"
  status = 301
  force = true

[[redirects]]
  from = "/jobs"
  to = "https://closingdate.lk/"
  status = 301
  force = true

[[redirects]]
  from = "/job/*"
  to = "https://closingdate.lk/job/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/apply.html"
  to = "https://closingdate.lk/apply.html"
  status = 301
  force = true

[[redirects]]
  from = "/closingdate/*"
  to = "/404.html"
  status = 404
  force = true

# The Record page is now part of the home page. Old links, including #dYYYY-MM-DD, still land on the right week.
[[redirects]]
  from = "/record.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/record"
  to = "/"
  status = 301

# Retired pages: Laws, later Acts, and the contract checker.
[[redirects]]
  from = "/laws.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/laws"
  to = "/"
  status = 301

[[redirects]]
  from = "/acts.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/acts"
  to = "/"
  status = 301

[[redirects]]
  from = "/checker.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/checker"
  to = "/"
  status = 301

# Alerts sign-up retired for now.
[[redirects]]
  from = "/alerts.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/alerts"
  to = "/"
  status = 301

[[redirects]]
  from = "/thanks.html"
  to = "/"
  status = 301

# The MCP function's source and packages are not pages: keep them unpublished.
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*"
  to = "/404.html"
  status = 404
  force = true

[functions]
  node_bundler = "esbuild"

# The nightly data must never be served stale.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
