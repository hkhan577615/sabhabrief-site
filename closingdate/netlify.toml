# closingdate.lk: a second Netlify site built from this same repository.
# In Netlify set Base directory = closingdate. Publish directory is this folder.
[build]
  publish = "."
  # Only redeploy when something in this folder changed (Sabha Brief's nightly commits are skipped).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# Old in-site addresses from when the jobs lived on Sabha Brief.
[[redirects]]
  from = "/jobs.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/jobs"
  to = "/"
  status = 301

# Scripts are not pages.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# The data must never be served stale.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
